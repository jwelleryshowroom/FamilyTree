<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Heritage - Family Tree</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Modules -->
    <script type="module" src="js/firebase/config.js"></script>
    <script type="module" src="js/firebase/db.js"></script>
    <script type="module" src="js/app.js"></script>
</head>

<body>

    <!-- Background Elements -->
    <div class="bg-gradient"></div>
    <div class="bg-pattern"></div>

    <!-- Header -->
    <header class="main-header">
        <div class="header-content">
            <div class="logo-container">
                <h1>The Heritage</h1>
                <p>Family Lineage of Nagendra & Basanti</p>
                <span class="version-badge">v2.9.3</span>
            </div>

            <!-- Navigation & Mode Controls Integrated in Header -->
            <div id="header-controls" class="header-controls">
                <div id="nav-controls" class="nav-controls" style="display:none;">
                    <button id="btn-back" class="btn-action btn-sm">← Back to Parent</button>
                </div>

                <div class="mode-controls">
                    <button id="btn-edit" class="btn-action btn-sm">Edit Tree</button>
                    <button id="btn-save" class="btn-action btn-sm btn-save" style="display:none;">Save Changes</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="tree-container" style="position: relative;">

        <!-- Root Generation (Parents) -->
        <section class="generation-root" id="root-container">
            <!-- Injected by JS: .couple-wrapper -->
        </section>

        <!-- SVG Connector Canvas -->
        <svg id="connector-svg"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible;">
            <!-- Curved paths will be drawn here by JS -->
        </svg>

        <!-- Split Layout -->
        <div class="split-layout">
            <!-- SONS -->
            <div class="branch branch-left">
                <h2 class="branch-title">Sons</h2>
                <div class="nodes-container" id="sons-container">
                    <!-- Injected by JS -->
                </div>
            </div>

            <!-- CENTRAL DIVIDER/LINE -->
            <div class="center-line"></div>

            <!-- DAUGHTERS -->
            <div class="branch branch-right">
                <h2 class="branch-title">Daughters</h2>
                <div class="nodes-container" id="daughters-container">
                    <!-- Injected by JS -->
                </div>
            </div>
        </div>

    </main>

    <!-- Profile Modal -->
    <div id="profile-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content card-glass">
            <button class="close-btn">&times;</button>

            <div class="modal-header">
                <div class="profile-photo-large" id="modal-photo">
                    <span id="modal-initials">?</span>
                </div>
                <h2 id="modal-name">Member Name</h2>
                <p id="modal-role">Role</p>
            </div>

            <div class="modal-body">
                <!-- View Mode Content -->
                <div id="modal-view-content">
                    <div class="info-group">
                        <label>Spouses</label>
                        <div id="modal-spouse" class="tag-list"></div>
                    </div>
                    <div class="info-group">
                        <label>Children</label>
                        <div id="modal-children" class="child-list"></div>
                    </div>
                </div>

                <!-- Edit Mode Form (Hidden by default) -->
                <form id="modal-edit-form" style="display:none;">
                    <div class="form-group photo-upload-group">
                        <label>Profile Photo</label>
                        <div class="photo-upload-container" id="edit-photo-area">
                            <input type="file" id="edit-photo-input" accept="image/*" hidden>
                            <div class="photo-preview-circle" id="edit-photo-preview">
                                <span class="upload-icon">📸</span>
                            </div>
                            <p class="upload-hint">Tap to change photo</p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="edit-name" class="form-input" placeholder="Enter name...">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Gender</label>
                            <div id="edit-gender-toggle" class="modern-switch">
                                <div class="switch-track">
                                    <div class="switch-thumb"></div>
                                </div>
                                <span class="switch-label">Female</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Life Status</label>
                            <div id="edit-status-toggle" class="modern-switch">
                                <div class="switch-track">
                                    <div class="switch-thumb"></div>
                                </div>
                                <span class="switch-label">Deceased</span>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" id="btn-delete-member" class="btn-danger-outline">Delete Member</button>
                        <button type="submit" class="btn-primary">Save Changes</button>
                    </div>
                </form>

                <!-- Create Mode Form (Hidden by default) -->
                <form id="modal-create-form" style="display:none;">
                    <h3 id="create-title" class="form-subtitle">Add New Member</h3>

                    <div class="form-group photo-upload-group">
                        <div class="photo-upload-container" id="create-photo-area">
                            <input type="file" id="create-photo-input" accept="image/*" hidden>
                            <div class="photo-preview-circle" id="create-photo-preview">
                                <span class="upload-icon">📸</span>
                            </div>
                            <p class="upload-hint">Upload Photo (Optional)</p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="create-name" class="form-input" placeholder="Enter name...">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Gender</label>
                            <div id="create-gender-toggle" class="modern-switch">
                                <div class="switch-track">
                                    <div class="switch-thumb"></div>
                                </div>
                                <span class="switch-label">Female</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Life Status</label>
                            <div id="create-status-toggle" class="modern-switch">
                                <div class="switch-track">
                                    <div class="switch-thumb"></div>
                                </div>
                                <span class="switch-label">Deceased</span>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="submit" id="btn-create-submit" class="btn-primary">Add Member</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
