<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Heritage - Family Tree v3.0.0</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Modules -->
    <script type="module" src="js/firebase/config.js"></script>
    <script type="module" src="js/firebase/db.js"></script>
    <script type="module" src="js/app.js"></script>
</head>

<body>

    <!-- Background Elements -->
    <div class="bg-gradient"></div>
    <div class="bg-pattern"></div>

    <!-- Header -->
    <header class="main-header">
        <div class="header-content">
            <div class="logo-container">
                <h1>The Heritage</h1>
                <p>Family Lineage of Nagendra & Basanti</p>
                <span class="version-badge">v3.7.7</span>
            </div>

            <!-- Navigation & Mode Controls Integrated in Header -->
            <div id="header-controls" class="header-controls">
                <div id="nav-controls" class="nav-controls" style="display:none;">
                    <button id="btn-back" class="btn-action btn-sm">← Back to Parent</button>
                </div>

                <div class="mode-controls">
                    <button id="btn-edit" class="btn-action btn-sm">Edit Tree</button>
                    <button id="btn-save" class="btn-action btn-sm btn-save" style="display:none;">Save Changes</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="tree-container" style="position: relative;">

        <!-- Root Generation (Parents) -->
        <section class="generation-root" id="root-container">
            <!-- Injected by JS: .couple-wrapper -->
        </section>

        <!-- SVG Connector Canvas -->
        <svg id="connector-svg"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible;">
            <!-- Curved paths will be drawn here by JS -->
        </svg>

        <!-- Split Layout -->
        <div class="split-layout">
            <!-- SONS -->
            <div class="branch branch-left">
                <h2 class="branch-title">Sons</h2>
                <div class="nodes-container" id="sons-container">
                    <!-- Injected by JS -->
                </div>
            </div>

            <!-- CENTRAL DIVIDER/LINE -->
            <div class="center-line"></div>

            <!-- DAUGHTERS -->
            <div class="branch branch-right">
                <h2 class="branch-title">Daughters</h2>
                <div class="nodes-container" id="daughters-container">
                    <!-- Injected by JS -->
                </div>
            </div>
        </div>

    </main>

    <!-- Profile Modal -->
    <div id="profile-modal" class="modal hidden profile-modal-modern">
        <div class="modal-overlay"></div>
        <div class="modal-content card-glass">
            <button class="close-btn">&times;</button>

            <div class="modal-body">
                <!-- View Mode: Tinder Style card -->
                <div id="modal-view-content">
                    <div id="tinder-card" class="tinder-wrapper">
                        <!-- Story Indicators at top -->
                        <div id="tinder-indicators" class="tinder-indicators"></div>

                        <!-- Photos (Injected by JS) -->
                        <div id="tinder-photos-container"></div>

                        <!-- Invisible Nav Taps -->
                        <div class="tinder-nav tinder-nav-left" id="tinder-prev"></div>
                        <div class="tinder-nav tinder-nav-right" id="tinder-next"></div>

                        <!-- Bottom Info Overlay -->
                        <div class="tinder-info-overlay">
                            <h2 id="modal-name">Member Name</h2>
                            <p id="modal-role">Role</p>
                        </div>

                        <!-- Floating Edit Button (View Mode Only) -->
                        <div id="btn-open-edit" class="edit-trigger" title="Edit Profile">
                            ✎
                        </div>
                    </div>
                </div>

                <!-- Hidden inputs for photo handling -->
                <input type="file" id="edit-photo-input" accept="image/*" hidden>
                <input type="file" id="create-photo-input" accept="image/*" hidden>

                <!-- Edit Mode Form (Hidden by default) -->
                <form id="modal-edit-form" style="display:none;">
                    <div class="form-header">
                        <div id="edit-profile-photo-container"></div>
                        <div class="form-header-content">
                            <h2 id="edit-form-title">Edit Profile</h2>
                            <p id="edit-form-subtitle">Member Details</p>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="edit-name" class="form-input" placeholder="Enter name...">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Date of Birth</label>
                            <input type="date" id="edit-dob" class="form-input">
                        </div>
                        <div class="form-group">
                            <label>WhatsApp Number</label>
                            <input type="tel" id="edit-whatsapp" class="form-input" placeholder="+91 ...">
                        </div>
                    </div>

                    <div id="edit-gallery-section" class="gallery-section">
                        <label>Gallery Photos</label>
                        <div id="edit-gallery-grid" class="gallery-grid">
                            <!-- Injected by JS: gallery items + add button -->
                        </div>
                        <input type="file" id="gallery-photo-input" accept="image/*" hidden>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Gender</label>
                            <div id="edit-gender-toggle" class="modern-switch">
                                <div class="switch-track">
                                    <div class="switch-thumb"></div>
                                </div>
                                <span class="switch-label">Female</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Life Status</label>
                            <div id="edit-status-toggle" class="modern-switch">
                                <div class="switch-track">
                                    <div class="switch-thumb"></div>
                                </div>
                                <span class="switch-label">Deceased</span>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" id="btn-delete-member" class="btn-danger-outline">Delete Member</button>
                        <button type="submit" class="btn-primary">Save Changes</button>
                    </div>
                </form>

                <!-- Create Mode Form (Hidden by default) -->
                <form id="modal-create-form" style="display:none;">
                    <div class="form-header">
                        <div id="create-profile-photo-container"></div>
                        <div class="form-header-content">
                            <h2 id="create-form-title">Add Member</h2>
                            <p id="create-form-subtitle">Expanding the Lineage</p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="create-name" class="form-input" placeholder="Enter name...">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Date of Birth</label>
                            <input type="date" id="create-dob" class="form-input">
                        </div>
                        <div class="form-group">
                            <label>WhatsApp Number</label>
                            <input type="tel" id="create-whatsapp" class="form-input" placeholder="+91 ...">
                        </div>
                    </div>

                    <div id="create-gallery-section" class="gallery-section">
                        <label>Gallery Photos</label>
                        <div id="create-gallery-grid" class="gallery-grid">
                            <!-- Injected by JS: gallery items + add button -->
                        </div>
                        <input type="file" id="create-gallery-photo-input" accept="image/*" hidden>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Gender</label>
                            <div id="create-gender-toggle" class="modern-switch">
                                <div class="switch-track">
                                    <div class="switch-thumb"></div>
                                </div>
                                <span class="switch-label">Female</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Life Status</label>
                            <div id="create-status-toggle" class="modern-switch">
                                <div class="switch-track">
                                    <div class="switch-thumb"></div>
                                </div>
                                <span class="switch-label">Deceased</span>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="submit" id="btn-create-submit" class="btn-primary">Add Member</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="confirm-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content confirm-box card-glass">
            <div class="confirm-body">
                <div class="confirm-icon">⚠️</div>
                <h3 id="confirm-title">Are you sure?</h3>
                <p id="confirm-message">This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button id="confirm-cancel" class="btn-secondary-outline">Cancel</button>
                <button id="confirm-ok" class="btn-danger">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
